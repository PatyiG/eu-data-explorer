name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to commit a missing package-lock.json once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Commit the lockfile if the repo has none yet
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add package-lock.json generated by CI"
            git push
          fi
      - name: Build
        run: npx ng build
      - name: Unit tests (Karma + Jasmine)
        run: npm run test:ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build for GitHub Pages
        run: npx ng build --base-href /eu-data-explorer/
      # GitHub Pages has no SPA fallback; serving index.html as the 404 page makes deep links work.
      - run: cp dist/eu-data-explorer/browser/index.html dist/eu-data-explorer/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/eu-data-explorer/browser
      - id: deployment
        uses: actions/deploy-pages@v4
